spring:
  application:
    name: assinaturas

  datasource:
    url: jdbc:postgresql://localhost:5432/assinaturas
    username: assinaturas
    password: assinaturas

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s

  kafka:
    bootstrap-servers: localhost:9092

app:
  gateway-pagamento:
    mock:
      taxa-aprovacao: 0.8
      taxa-recusa: 0.15
  cache:
    assinatura-ativa:
      ttl: 5m