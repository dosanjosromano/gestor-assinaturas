spring:
  application:
    name: assinaturas

  datasource:
    url: jdbc:postgresql://localhost:5432/assinaturas
    username: assinaturas
    password: assinaturas

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
